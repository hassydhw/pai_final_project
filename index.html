<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quest 3 VR Teleop Controller</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #111827; color: #fff; margin: 0; overflow: hidden; }
        #info { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 100; }
        button { font-size: 20px; padding: 12px 24px; margin-top: 15px; border-radius: 8px; cursor: pointer; background: #0284c7; color: white; border: none; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { font-size: 18px; color: #38bdf8; margin-top: 15px; font-weight: bold; }
        #wsUrl { font-size: 14px; color: #94a3b8; margin-top: 6px; }
        #help { font-size: 15px; color: #cbd5e1; margin-top: 20px; line-height: 1.7; }
    </style>
    <!-- Three.js (3Dグラフィックライブラリ) の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="info">
        <h1>Quest 3 VR Teleop</h1>
        <div id="status">サーバーに接続中...</div>
        <div id="wsUrl"></div>
        <button id="startBtn" disabled>VR開始</button>
        <div id="help">
            VR 内にアームとブロックを表示（アームの最上部が目の高さ。右手の位置にグリッパーが来る）<br>
            右手コントローラの位置 → アーム先端<br>
            グリップボタン → グリッパー開閉（押し込むと閉じる）<br>
            A ボタン → 前後左右の原点リセット（今の手の位置を基準に取り直す。机の高さはそのまま）<br>
            B ボタン → 赤ブロックを再配置（配置成功後は自動で再配置）
        </div>
    </div>

    <script>
        // 配信元と同じホストの /ws に接続する（https なら wss、http なら ws）
        const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
        const RECONNECT_MS = 2000;

        let ws = null;
        let scene, camera, renderer, controllerRight = null, controllerMat;
        let prevAPressed = false, prevBPressed = false;

        // サーバーから受け取ったシミュレーションの表示（ロボット座標の geom をそのまま子に持つ）
        let robotRoot = null, geomRoot = null, geomObjects = [], successMaterial = null, successBaseColor = null, successColor = null;

        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        document.getElementById('wsUrl').innerText = WS_URL;

        // Three.js 3D視覚空間の初期化
        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 10);

            // VR空間の床（グリッド）と照明
            const gridHelper = new THREE.GridHelper(10, 10, 0x38bdf8, 0x334155);
            scene.add(gridHelper);

            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
            light.position.set(0, 1, 0);
            scene.add(light);
            // ロボット座標（x=前, y=左, z=上）→ WebXR 座標（x=右, y=上, z=手前）への回転。
            // 位置（anchor）と縮尺はサーバーから受け取る
            robotRoot = new THREE.Group();
            robotRoot.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
                new THREE.Vector3(0, 0, -1), new THREE.Vector3(-1, 0, 0), new THREE.Vector3(0, 1, 0)));
            robotRoot.visible = false;
            scene.add(robotRoot);
            geomRoot = new THREE.Group();
            robotRoot.add(geomRoot);

            // 影を落とすライト（ロボット座標で真上やや手前から。アームと一緒に動く）
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(0.05, 0.05, 1.0);
            sun.target.position.set(0.15, 0, 0);
            sun.castShadow = true;
            sun.shadow.mapSize.set(1024, 1024);
            Object.assign(sun.shadow.camera, { left: -0.6, right: 0.6, top: 0.6, bottom: -0.6, near: 0.5, far: 4 });
            sun.shadow.bias = -0.0005;
            robotRoot.add(sun, sun.target);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // WebXR（VR機能）を有効化
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // コントローラの視覚化マーカー（球体。グリップ量で赤→緑に変化）
            // getController(0) が右手とは限らないため、handedness で右手を判定する
            for (let i = 0; i < 2; i++) {
                const controller = renderer.xr.getController(i);
                controller.addEventListener('connected', (e) => {
                    if (e.data.handedness === 'right') {
                        controllerRight = controller;
                        // グリッパーと重なるので小さめ・半透明にする
                        controllerMat = new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.5 });
                        controller.add(new THREE.Mesh(new THREE.SphereGeometry(0.015, 16, 16), controllerMat));
                    }
                });
                controller.addEventListener('disconnected', () => {
                    if (controllerRight === controller) {
                        controllerRight = null;
                        controller.clear();
                    }
                });
                scene.add(controller);
            }
        }

        // MuJoCo の geom 1 個分の Three.js オブジェクトを作る（size は MuJoCo の半径・半長）。
        // MuJoCo の円柱・カプセルの軸は z、Three.js は y なので、ジオメトリを x 軸回りに回しておく
        function makeGeomObject(g) {
            const [r, gr, b, a] = g.rgba;
            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color(r, gr, b), transparent: a < 1, opacity: a, roughness: 0.6
            });
            const s = g.size;
            switch (g.type) {
                case 'box':
                    return new THREE.Mesh(new THREE.BoxGeometry(2 * s[0], 2 * s[1], 2 * s[2]), material);
                case 'sphere':
                    return new THREE.Mesh(new THREE.SphereGeometry(s[0], 16, 12), material);
                case 'cylinder':
                    return new THREE.Mesh(
                        new THREE.CylinderGeometry(s[0], s[0], 2 * s[1], 20).rotateX(Math.PI / 2), material);
                case 'capsule': {
                    // r128 には CapsuleGeometry がないので、円柱 + 両端の球で作る
                    const capsule = new THREE.Group();
                    capsule.add(new THREE.Mesh(
                        new THREE.CylinderGeometry(s[0], s[0], 2 * s[1], 16).rotateX(Math.PI / 2), material));
                    for (const z of [-s[1], s[1]]) {
                        const cap = new THREE.Mesh(new THREE.SphereGeometry(s[0], 16, 12), material);
                        cap.position.z = z;
                        capsule.add(cap);
                    }
                    capsule.userData.material = material;
                    return capsule;
                }
                case 'plane':
                    return new THREE.Mesh(new THREE.PlaneGeometry(2 * s[0], 2 * s[1]), material);
                default:
                    console.warn('未対応の geom:', g.type);
                    return null;
            }
        }

        // 接続時に 1 回届くシーン情報（geom の形・大きさ・色）から表示を作り直す
        function buildScene(msg) {
            geomRoot.clear();
            robotRoot.scale.setScalar(msg.scale);
            geomObjects = msg.geoms.map((g) => {
                const obj = makeGeomObject(g);
                if (!obj) return null;
                // 床は影を受けるだけ。半透明の目標球は影を落とさない
                obj.traverse((o) => {
                    o.castShadow = g.type !== 'plane' && g.rgba[3] === 1;
                    o.receiveShadow = true;
                });
                geomRoot.add(obj);
                return obj;
            });
            const area = geomObjects[msg.success_geom];
            successMaterial = area ? (area.userData.material || area.material) : null;
            successBaseColor = successMaterial ? successMaterial.color.clone() : null;
            successColor = new THREE.Color(...msg.success_rgba.slice(0, 3));
        }

        // 30 Hz で届く状態（各 geom の位置・姿勢、配置成功中か、表示位置）を反映する
        function applyState(msg) {
            if (!msg.anchor) {
                robotRoot.visible = false;  // 手の原点が決まるまでは表示しない
                return;
            }
            robotRoot.position.fromArray(msg.anchor);
            robotRoot.visible = true;
            msg.poses.forEach((p, i) => {
                const obj = geomObjects[i];
                if (!obj) return;
                obj.position.set(p[0], p[1], p[2]);
                obj.quaternion.set(p[4], p[5], p[6], p[3]);  // MuJoCo は (w, x, y, z)
            });
            if (successMaterial) successMaterial.color.copy(msg.success ? successColor : successBaseColor);
        }

        // WebSocket 接続（切断時は自動で再接続）
        function connect() {
            statusDiv.innerText = 'サーバーに接続中...';
            ws = new WebSocket(WS_URL);

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'scene') buildScene(msg);
                else if (msg.type === 'state') applyState(msg);
            };
            ws.onopen = () => {
                statusDiv.innerText = '✅ 接続済み — VR開始を押してください';
                startBtn.disabled = false;
            };
            ws.onclose = () => {
                robotRoot.visible = false;
                statusDiv.innerText = `切断されました。${RECONNECT_MS / 1000}秒後に再接続します...`;
                setTimeout(connect, RECONNECT_MS);
            };
            ws.onerror = () => { ws.close(); };
        }

        // 右手の gamepad から入力を読む（xr-standard: buttons[1]=grip, buttons[4]=A, buttons[5]=B）
        function readRightGamepad(session) {
            for (const source of session.inputSources) {
                if (source.handedness === 'right' && source.gamepad) {
                    const b = source.gamepad.buttons;
                    return {
                        grip: b[1] ? b[1].value : 0,
                        aPressed: b[4] ? b[4].pressed : false,
                        bPressed: b[5] ? b[5].pressed : false
                    };
                }
            }
            return { grip: 0, aPressed: false, bPressed: false };
        }

        initThree();
        connect();

        // requestSession はユーザー操作（クリック）から呼ぶ必要がある
        startBtn.addEventListener('click', async () => {
            try {
                const session = await navigator.xr.requestSession('immersive-vr', {
                    optionalFeatures: ['local-floor', 'bounded-floor']
                });
                await renderer.xr.setSession(session);
                document.getElementById('info').style.display = 'none';

                session.addEventListener('end', () => {
                    renderer.setAnimationLoop(null);
                    document.getElementById('info').style.display = '';
                });

                // VR を開始するたびに、最初に目の高さが取れたフレームで机の高さを決め直してもらう
                let needRecenter = true;

                // VR描画 & リアルタイムデータ送信ループ
                renderer.setAnimationLoop((time, frame) => {
                    renderer.render(scene, camera);

                    if (!controllerRight || !ws || ws.readyState !== WebSocket.OPEN) return;

                    // HMD（目）の高さ。サーバーはこれにアームの最上部が来るよう机の高さを決める
                    const viewerPose = frame && frame.getViewerPose(renderer.xr.getReferenceSpace());
                    if (!viewerPose) return;
                    const eye = viewerPose.transform.position.y;

                    const pos = controllerRight.position;
                    const { grip, aPressed, bPressed } = readRightGamepad(session);
                    controllerMat.color.setRGB(0.94 * (1 - grip), 0.27 + 0.6 * grip, 0.27);

                    const payload = {
                        x: parseFloat(pos.x.toFixed(3)),
                        y: parseFloat(pos.y.toFixed(3)),
                        z: parseFloat(pos.z.toFixed(3)),
                        gripper: parseFloat(grip.toFixed(2)),
                        eye: parseFloat(eye.toFixed(3))
                    };
                    if (needRecenter) {
                        payload.recenter = true;
                        needRecenter = false;
                    }
                    // A ボタンを押した瞬間だけ原点リセットを要求
                    if (aPressed && !prevAPressed) payload.reset = true;
                    if (bPressed && !prevBPressed) payload.reset_block = true;
                    prevAPressed = aPressed;
                    prevBPressed = bPressed;

                    ws.send(JSON.stringify(payload));
                });
            } catch (err) {
                statusDiv.innerText = 'VRセッション開始失敗: ' + err.message;
            }
        });
    </script>
</body>
</html>
